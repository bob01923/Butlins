<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B3A5C">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Butlin's Planner">

<meta name="description" content="Personalised Butlin's Bognor Regis holiday planner — sensory-friendly itinerary for families.">
<title>Butlin's Bognor · Holiday Planner</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--navy:#1B3A5C;--red:#C8321A;--bg:#F2F0EB;--card:#fff;--border:#E2DDD6;--green:#1E8C5C;--green-bg:#E8F7EF;--amber:#C47C10;--amber-bg:#FEF3DC;--text:#1A1A1A;--muted:#5C6370;--light:#A0A7B0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh}
#hd{background:var(--navy);color:#fff;padding:11px 10px 8px;position:sticky;top:0;z-index:100}
#hd .stripe{position:absolute;top:0;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,var(--red) 0,var(--red) 12px,#fff 12px,#fff 24px)}
#hd .title{font-size:15px;font-weight:800}
#hd .sub{font-size:11px;opacity:.65;margin-top:1px}
#hd .wg-cell{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.2);color:#fff}
#hd .wg-cell.on{background:rgba(255,255,255,0.25);border-color:rgba(255,255,255,0.6)}
#hd .wg-d{color:#fff}
#hd .wg-dt{color:rgba(255,255,255,0.65)}
#hd .wg-n{font-weight:700}
#hd .wg-row{color:rgba(255,255,255,0.75)}
#hd .wg-free{color:rgba(255,255,255,0.45)}
#hd .wg-more{color:rgba(255,255,255,0.45)}
#mn{padding:0 0 80px}
#nv{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;padding:9px 4px 7px;text-align:center;font-size:10px;font-weight:700;color:var(--light);cursor:pointer;border:none;background:none;text-transform:uppercase;letter-spacing:.3px}
.nb.on{color:var(--navy)}
.nb .ic{font-size:18px;display:block;margin-bottom:1px}
.nv-row{display:flex}
.undo-bar{background:#1e293b;color:#fff;padding:6px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.undo-btn{color:#93c5fd;background:none;border:none;cursor:pointer;font-size:12px;font-weight:700}
/* Week grid */
.wg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.wg-cell{background:var(--card);border-radius:9px;border:1.5px solid var(--border);padding:7px 8px;cursor:pointer;min-height:62px}
.wg-cell.on{border-color:var(--navy);background:#eef2ff}
.wg-cell.fri{min-height:auto;display:flex;align-items:center;gap:6px;padding:5px 8px;grid-column:1/-1}
.wg-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1px}
.wg-d{font-size:12px;font-weight:800}
.wg-dt{font-size:10px;color:var(--muted)}
.wg-n{font-size:10px;font-weight:700;margin-bottom:2px}
.wg-items{display:flex;flex-direction:column;gap:1px}
.wg-row{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--muted);overflow:hidden;white-space:nowrap}
.wg-dot{width:5px;height:5px;border-radius:3px;flex-shrink:0;display:inline-block}
.wg-more{font-size:9px;color:var(--light);margin-top:1px}
.wg-free{font-size:10px;color:var(--light);font-style:italic}
@keyframes wg-flash{0%{border-color:#3b82f6;background:#dbeafe}100%{border-color:var(--border);background:var(--card)}}
.wg-cell.on.flash,
.wg-cell.flash{animation:wg-flash .6s ease-out}
/* Plan view */
.now-next{background:#0f2040;color:#fff;padding:8px 12px;font-size:12px}
.nn-label{font-size:10px;opacity:.6;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.nn-name{font-size:14px;font-weight:800;margin:1px 0}
.nn-next{font-size:11px;opacity:.75}
.warn-btn{display:block;width:calc(100% - 16px);margin:5px 8px 2px;padding:6px 10px;border-radius:8px;border:1px solid #fde68a;background:var(--amber-bg);color:#92400e;font-size:12px;font-weight:700;cursor:pointer;text-align:left}
.warn-item{margin:2px 8px;padding:5px 9px;border-radius:7px;background:#fff;border:1px solid var(--border);font-size:11px;color:var(--muted)}
.day-hd{background:var(--navy);color:#fff;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin:6px 8px 0;border-radius:8px 8px 0 0}
.day-hd .pace{font-size:11px;opacity:.75;font-weight:500}
.tl{margin:0 8px;background:var(--card);border-radius:0 0 8px 8px;overflow:hidden;border:1px solid var(--border);border-top:none;margin-bottom:6px}
.tl-row{display:flex;align-items:flex-start;padding:6px 10px;border-bottom:1px solid #f4f2ef;cursor:pointer}
.tl-row:last-child{border-bottom:none}
.tl-row.done .tl-name{text-decoration:line-through;opacity:.5}
.tl-row.admin{opacity:.65}
.tl-time{width:36px;font-size:11px;font-weight:700;color:var(--light);flex-shrink:0;padding-top:2px;font-variant-numeric:tabular-nums}
.tl-bar{width:3px;min-height:18px;align-self:stretch;border-radius:2px;flex-shrink:0;margin:2px 7px 0 0}
.tl-body{flex:1;min-width:0}
.tl-name{font-size:13px;font-weight:700;line-height:1.3}
.tl-meta{font-size:11px;color:var(--muted)}
.tl-exp{margin-top:5px;padding-top:5px;border-top:1px solid #f0ede8}
.tl-note{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:3px}
.tl-bed{font-size:10px;color:#a78bfa;font-weight:600;margin-top:2px}
.tl-done-btn{margin-top:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer}
.tl-done-btn.done{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.walk-sep{display:flex;align-items:center;gap:4px;padding:2px 10px 2px 46px;font-size:10px;font-weight:700;color:var(--amber);opacity:.85}
.walk-line{flex:1;height:1px;background:var(--amber);opacity:.3}
.rosie-btn{display:block;width:calc(100% - 16px);margin:0 8px 6px;padding:7px 10px;border-radius:8px;border:1px dashed #c084fc;background:#fdf4ff;color:#7c3aed;font-size:12px;font-weight:700;cursor:pointer;text-align:left}
.rosie-box{margin:0 8px 6px;background:#fdf4ff;border:1px solid #e9d5ff;border-radius:8px;padding:10px;font-size:14px;line-height:1.8;color:#4a1d96}
.rosie-lbl{font-size:10px;font-weight:700;color:#7c3aed;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
/* Add view */
.settings-bar{padding:9px 12px;background:#fff;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.settings-bar .sm{font-size:11px;color:var(--muted);font-weight:500}
.settings-panel{padding:9px 12px;background:#fff;border-bottom:1px solid var(--border)}
.sg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:7px}
.sg2{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:7px}
.fl label{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:2px}
.fl select{width:100%;border:1px solid var(--border);border-radius:7px;padding:5px 6px;font-size:12px;background:#fff;color:var(--text)}
.nap-row{display:flex;gap:4px;margin-bottom:7px}
.nap-btn{flex:1;padding:5px 2px;border-radius:7px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700;color:var(--light);cursor:pointer;text-align:center}
.nap-btn.on{background:#dbeafe;border-color:#3b82f6;color:#1d4ed8}
.sen-btn{width:100%;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;text-align:left;cursor:pointer;border:2px solid var(--border);background:#fff;color:var(--light)}
.sen-btn.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.sen-note{font-size:11px;color:var(--muted);margin-top:3px;padding-left:4px;line-height:1.5}
.cat-pills{display:flex;gap:4px;padding:7px 8px 3px;overflow-x:auto;scrollbar-width:none}
.cat-pill{flex-shrink:0;padding:4px 11px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.cat-pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sec-hd{padding:8px 10px 3px;font-size:10px;font-weight:800;color:var(--light);text-transform:uppercase;letter-spacing:.6px}
.ic{margin:0 8px 4px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);overflow:hidden}
.ic.sel{border-color:#3b82f6}
.ic.dim{opacity:.35}
.ic-main{display:flex;align-items:center;gap:7px;padding:8px 9px;cursor:pointer}
.ic-dot{width:7px;height:7px;border-radius:4px;flex-shrink:0}
.ic-label{flex:1;font-size:13px;font-weight:700;line-height:1.3}
.ic-sub{font-size:11px;color:var(--muted)}
.ic-actions{display:flex;gap:5px;align-items:center}
.ic-exp-btn{font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 4px}
.ic-cb{width:21px;height:21px;border-radius:11px;border:2px solid #cbd5e1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.ic-cb.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
.ic-desc{padding:0 9px 7px 23px;font-size:12px;color:var(--muted);line-height:1.55;border-top:1px solid #f5f3ef}
.slots{padding:6px 9px 7px;border-top:1px solid var(--border);background:#fafaf8}
.slots-hd{display:flex;justify-content:space-between;margin-bottom:4px;font-size:11px;font-weight:700;color:var(--muted)}
.slots-all{color:#3b82f6;background:none;border:none;cursor:pointer;font-size:11px;font-weight:700}
.slot-btns{display:flex;flex-wrap:wrap;gap:3px}
.sb{font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;text-align:center;min-width:72px}
.sb.on{background:#dbeafe;border-color:#3b82f6;color:#1d4ed8}
.sb.clash{border-color:#fca5a5}
.sb.tight{border-color:#fbbf24}
.sb-st{display:block;font-size:9px;font-weight:700}
.sb-st.ok{color:var(--green)}.sb-st.clash{color:#ef4444}.sb-st.tight{color:#d97706}
.sc-card{margin:0 8px 5px;border-radius:10px;padding:9px 11px;cursor:pointer}
.sel-bar{display:flex;justify-content:space-between;align-items:center;padding:3px 10px 1px}
.sel-bar span{font-size:12px;color:var(--muted)}
.clear-btn{font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px}
/* Prep view */
.prep{padding:10px}
.prep-hd{font-size:14px;font-weight:700;margin:6px 0 5px}
.book-list{background:var(--card);border-radius:9px;border:1px solid var(--border);overflow:hidden;margin-bottom:10px}
.book-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #f5f3ef;gap:6px}
.book-row:last-child{border-bottom:none}
.book-name{font-size:13px;font-weight:700}
.book-num{color:var(--light);margin-right:3px}
.book-when{font-size:11px;color:var(--muted);margin-top:1px}
.book-cost{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0}
.cost-free{background:var(--green-bg);color:var(--green)}
.cost-tok{background:var(--amber-bg);color:var(--amber)}
.tok-box{background:#f8f6f2;border-radius:9px;padding:9px;margin-bottom:10px;border:1px solid var(--border)}
.tok-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:1px 0}
.tok-total{display:flex;justify-content:space-between;font-size:13px;font-weight:700;border-top:1px solid var(--border);padding-top:5px;margin-top:3px}
.tier-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
.tier-tbl th{text-align:left;padding:4px 7px;font-size:10px;font-weight:700;color:var(--muted);border-bottom:1.5px solid var(--border)}
.tier-tbl td{padding:4px 7px;border-bottom:1px solid #f5f3ef}
.tier-tbl tr.cur td{background:#dbeafe;font-weight:700;color:#1d4ed8}
.cl-item{display:flex;gap:6px;margin-bottom:4px;font-size:13px;color:#475569;line-height:1.5}
.cl-box{color:var(--light);flex-shrink:0}
.footer-tok{text-align:center;padding:4px 0 2px;font-size:12px;font-weight:700;color:var(--amber);background:#fff}
.copy-toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:700;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.copy-toast.show{opacity:1}

.cl-item{cursor:pointer;align-items:flex-start}
.cl-item.checked{opacity:.5}
.cl-item.checked span:last-child{text-decoration:line-through}
.cl-check{width:18px;height:18px;border-radius:5px;border:2px solid #cbd5e1;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;margin-top:1px}
.cl-check.on{background:var(--green);border-color:var(--green)}
.guide-card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:12px;margin:0 10px 10px}
.guide-card h3{font-size:14px;font-weight:800;margin-bottom:7px;color:var(--navy);display:flex;align-items:center;gap:6px}
.guide-card p{font-size:13px;line-height:1.6;color:#374151;margin-bottom:6px}
.guide-card p:last-child{margin-bottom:0}
.guide-card .label{font-weight:700;color:var(--navy)}
.zone-map{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.zone-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 8px;border-radius:7px;background:#fafaf8;border:1px solid var(--border)}
.zone-pin{width:12px;height:12px;border-radius:6px;flex-shrink:0}
.zone-name{font-weight:700;flex:1}
.zone-walk{font-size:11px;color:var(--muted)}
.sos-card{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px;margin:0 10px 10px}
.sos-card h3{color:#991b1b;font-size:14px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.sos-card p{font-size:13px;line-height:1.6;color:#7f1d1d;margin-bottom:5px}
.day-note-btn{display:block;width:calc(100% - 16px);margin:0 8px 6px;padding:7px 10px;border-radius:8px;border:1px dashed #cbd5e1;background:#fff;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;text-align:left}
.day-note-box{margin:0 8px 6px}
.day-note-box textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:54px;color:var(--text)}
.weather-strip{display:flex;gap:6px;margin:6px 10px 10px;overflow-x:auto;scrollbar-width:none}
.wx-day{flex:1;min-width:62px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 4px;text-align:center}
.wx-d{font-size:11px;font-weight:700;color:var(--muted)}
.wx-ic{font-size:20px;margin:2px 0}
.wx-t{font-size:12px;font-weight:700}
</style>
</head>

  <div id="hd">
    <div class="stripe"></div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><div class="title">Butlin's Bognor Regis</div><div class="sub">Rob, Becky & Rosie · 15–19 June 2026</div></div>
      <button data-action="copy" style="background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;flex-shrink:0">⧉ Share</button>

  <div id="mn"></div>

</div>
<script>

  {id:'totsfootball',g:'Activities',name:'Tots Fun Football (2–4yrs)',v:'Activity Gardens',dur:30,sen:'safe',cost:'Free',tk:0,pp:false,bk:true,ages:'2–4',pri:5,multi:false,
   desc:'Gentle football for toddlers. Outdoor at Activity Gardens, next to Bullseye Bay — can do back-to-back with Mini Bow.',
   slots:[{day:'tue',s:'10:00',e:'10:30',l:'Tue 10:00'},{day:'tue',s:'10:30',e:'11:00',l:'Tue 10:30'},{day:'tue',s:'11:00',e:'11:30',l:'Tue 11:00'},{day:'tue',s:'11:30',e:'12:00',l:'Tue 11:30'},{day:'wed',s:'14:00',e:'14:30',l:'Wed 14:00'},{day:'wed',s:'14:30',e:'15:00',l:'Wed 14:30'},{day:'wed',s:'15:00',e:'15:30',l:'Wed 15:00'}]},

function slotSt(item,si){
  const s=item.slots[si];if(!s)return'ok';
  const sS=toM(s.s),sE=toM(s.e);
  for(const[oid,slots]of Object.entries(SEL)){if(oid===item.id)continue;const oi=ITEMS.find(i=>i.id===oid);if(!oi)continue;for(const osi of slots){const os=oi.slots[osi];if(!os||os.day!==s.day)continue;if(sS<toM(os.e)&&toM(os.s)<sE)return'clash';const g=Math.min(Math.abs(sS-toM(os.e)),Math.abs(toM(os.s)-sE));if(g>0&&g<wt(item.v,oi.v))return'tight';}}
  return'ok';
}
function anchorCount(day){let n=0;Object.entries(SEL).forEach(([id,slots])=>{const item=ITEMS.find(i=>i.id===id);if(!item)return;slots.forEach(si=>{const s=item.slots[si];if(s&&s.day===day)n++;});});return n;}
function bestSlot(item){let b=0,bs=-99;item.slots.forEach((s,i)=>{const st=slotSt(item,i);if(st==='clash')return;const sc=(st==='ok'?10:3)-anchorCount(s.day)*3;if(sc>bs){bs=sc;b=i;}});return b;}
function oOpts(day,sM){const o=[];if(sM<600)o.push('Tots Quiet Swim 9-10am');o.push('Tots Fairground','Beach','Splash pool','Playground');return o;}
function bedCD(t,bedM){const m=bedM-toM(t);if(m<=0||m>480)return null;const h=Math.floor(m/60),mn=m%60;return(h>0?h+'h':'')+( mn>0?mn+'m':'')+' to bed';}
function nowNext(dayItems){const now=new Date();const curM=now.getHours()*60+now.getMinutes();const d=now.getDay();const dayMap=[null,'mon','tue','wed','thu','fri',null];const today=dayMap[d];if(today!==AD)return null;const real=now.getFullYear()===2026&&now.getMonth()===5&&now.getDate()>=15&&now.getDate()<=19;if(!real)return null;const active=dayItems.find(i=>toM(i.time)<=curM&&toM(i.end)>curM);const next=dayItems.find(i=>toM(i.time)>curM&&i.type!=='evening');return{active,next,curM};}
function rosiePrep(day){const items=(PLAN.days[day]||[]).filter(i=>i.type==='anchor'||i.type==='show');if(!items.length)return'A free day — explore wherever you like!';const map={'Swim':'go swimming','Peppa':'watch Peppa Pig','Pottery':'paint a pot','Soft Play':'play in soft play','Bow':'do archery','Football':'play football','Balance':'ride a balance bike','Jack':'watch a panto show','Puppet':'watch puppets','Skyline':'see the Skyline Gang','Golf':'play mini golf','Bowling':'go bowling','photo':'have a photo with a character','Photo':'have a photo with a character'};const parts=items.slice(0,4).map(i=>{for(const[k,v]of Object.entries(map)){if(i.name.includes(k))return v;}return i.name.toLowerCase();});return'Tomorrow: '+parts.join(', then ')+'.';}

  return{days:result,bookings,totalTk,tkP,tkB,conflicts,walkW,dayAnchors,balance};

    const curTk=p.totalTk;
    h+='<div class="prep-hd">Token price tiers</div><table class="tier-tbl"><tr><th>Tokens</th><th>Each</th><th>Total</th><th></th></tr>';
    tiers.forEach(([lo,hi,rate])=>{const isCur=curTk>=lo&&curTk<=hi;h+='<tr'+(isCur?' class="cur"':'')+'><td>'+lo+(hi<99?'–'+hi:'+')+'</td><td>£'+rate.toFixed(2)+'</td><td>'+(isCur&&curTk>0?'£'+(curTk*rate).toFixed(2):'—')+'</td><td style="font-size:10px">'+(isCur?'← you':'')+((!isCur&&curTk>0&&lo>curTk)?'+' +(lo-curTk)+' tokens':'')+'</td></tr>';});
    h+='</table>';
  }
  CHECKLIST.forEach((sec,si)=>{
    h+='<div class="prep-hd">'+sec.t+'</div>';
    sec.items.forEach((it,ii)=>{const key='cl_'+si+'_'+ii;const ck=!!CHECK[key];h+='<div class="cl-item'+(ck?' checked':'')+'" data-check="'+key+'"><span class="cl-check'+(ck?' on':'')+'">'+(ck?'✓':'')+'</span><span>'+it+'</span></div>';});
  });
  h+='</div>';return h;
}

// ═══ RENDER ═══
function render(){
  PLAN=buildPlan();
  const np=parseInt(S.numPeople)||3;
  const totalTk=Object.entries(SEL).reduce((a,[id,slots])=>{const item=ITEMS.find(i=>i.id===id);return item&&item.tk>0?a+item.tk*(item.pp?np:1)*slots.length:a;},0);
  const rate=totalTk>=4?7.10:8.50;
  document.getElementById('gd').innerHTML=rGrid();
  document.getElementById('mn').innerHTML=V==='plan'?rPlan():V==='add'?rAdd():V==='guide'?rGuide():rPrep();
  let nav='';
  if(PREV_SEL)nav='<div class="undo-bar"><span>Changed</span><button class="undo-btn" data-action="undo">↩ Undo</button></div>';
  nav+='<div class="nv-row">';
  const tabDefs=[['plan','▤','Plan'],['add','＋','Build'],['prep','✓','Book'],['guide','◎','Guide']];
  nav+=tabDefs.map(([v,ic,lb])=>'<button class="nb'+(V===v?' on':'')+'" data-nav="'+v+'"><span class="ic">'+ic+'</span>'+lb+'</button>').join('');
  nav+='</div>';
  if(totalTk>0&&V==='add')nav='<div class="footer-tok">🪙 '+totalTk+' tokens · £'+(totalTk*rate).toFixed(2)+' pre-arrival</div>'+nav;
  document.getElementById('nv').innerHTML=nav;
}

// ═══ EVENTS ═══
function copyPlan(){
  const lines=["Butlin's Bognor Regis — 15-19 June 2026",""];
  DAYS.slice(0,5).forEach(d=>{lines.push(DL[d]+' '+DD[d]);const items=(PLAN.days[d]||[]).filter(i=>i.type==='anchor'||i.type==='show');if(!items.length){lines.push('  Free day');}else{items.forEach(i=>lines.push('  '+i.time+' '+i.name));}lines.push('');});
  navigator.clipboard?.writeText(lines.join('\n')).then(()=>{const t=document.getElementById('copy-toast');if(t){t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}});
}
document.addEventListener('click',e=>{
  const done=e.target.closest('[data-done]');
  if(done){e.stopPropagation();const k=done.dataset.done;DONE[k]=!DONE[k];save();render();return;}
  const check=e.target.closest('[data-check]');
  if(check){const k=check.dataset.check;CHECK[k]=!CHECK[k];save();render();return;}
  const slot=e.target.closest('[data-slot]');
  if(slot){e.stopPropagation();const id=slot.dataset.slot,i=parseInt(slot.dataset.si);const item=ITEMS.find(x=>x.id===id);if(!item||!SEL[id])return;if(item.multi){const s=new Set(SEL[id]);s.has(i)?s.delete(i):s.add(i);SEL[id]=[...s].sort();if(!SEL[id].length)delete SEL[id];}else SEL[id]=[i];save();render();return;}
  const slotAll=e.target.closest('[data-slotall]');
  if(slotAll){e.stopPropagation();const id=slotAll.dataset.slotall;const item=ITEMS.find(x=>x.id===id);if(!item)return;SEL[id]=SEL[id]&&SEL[id].length===item.slots.length?[]:item.slots.map((_,i)=>i);if(!SEL[id].length)delete SEL[id];save();render();return;}
  const toggle=e.target.closest('[data-toggle]');
  if(toggle){PREV_SEL=JSON.parse(JSON.stringify(SEL));const id=toggle.dataset.toggle;if(SEL[id])delete SEL[id];else{const item=ITEMS.find(x=>x.id===id);if(item){SEL[id]=item.multi?item.slots.map((_,i)=>i):[bestSlot(item)];const day=item.slots[SEL[id][0]]?.day;if(day)flashDay(day);}}save();render();return;}
  const scenario=e.target.closest('[data-scenario]');
  if(scenario){const sc=SCENARIOS.find(s=>s.id===scenario.dataset.scenario);if(sc){PREV_SEL=JSON.parse(JSON.stringify(SEL));SEL={...sc.sel};if(sc.id==='sensory-tot')S={...S,sensory:true,napDays:['tue','thu'],bedNap:'19:00',bedNoNap:'17:30'};else if(sc.id==='active-tot')S={...S,sensory:false,napDays:['tue','wed'],bedNap:'19:30',bedNoNap:'18:00'};else S={...S,sensory:false,napDays:[],bedNap:'20:30',bedNoNap:'20:30'};save();render();}return;}
  const nav=e.target.closest('[data-nav]');
  if(nav){V=nav.dataset.nav;render();return;}
  const day=e.target.closest('[data-day]');
  if(day){AD=day.dataset.day;if(V!=='plan')V='plan';render();return;}
  const expand=e.target.closest('[data-expand]');
  if(expand){e.stopPropagation();const k=expand.dataset.expand;EX[k]=!EX[k];render();return;}
  const napday=e.target.closest('[data-napday]');
  if(napday){const d=napday.dataset.napday;const nd=[...S.napDays];const i=nd.indexOf(d);if(i>=0)nd.splice(i,1);else nd.push(d);S={...S,napDays:nd};save();render();return;}
  const catpill=e.target.closest('[data-catpill]');
  if(catpill){ADD_CAT=catpill.dataset.catpill==='All'?null:catpill.dataset.catpill;render();return;}
  const action=e.target.closest('[data-action]');
  if(action){
    const a=action.dataset.action;
    if(a==='toggle-settings'){SHOW_S=!SHOW_S;render();}
    if(a==='toggle-warns'){EX.warns=!EX.warns;render();}
    if(a==='clear'){PREV_SEL=JSON.parse(JSON.stringify(SEL));SEL={};DONE={};save();render();}
    if(a==='undo'){if(PREV_SEL){SEL=PREV_SEL;PREV_SEL=null;save();render();}}
    if(a==='copy')copyPlan();
    if(a==='sen'){S={...S,sensory:!S.sensory};save();render();}
    const sm=a.match(/^prep-story-(.+)/);
    if(sm){EX['story_'+sm[1]]=!EX['story_'+sm[1]];render();}
    const nm=a.match(/^note-(.+)/);
    if(nm){EX['note_'+nm[1]]=!EX['note_'+nm[1]];render();}
  }
});
document.addEventListener('change',e=>{const s=e.target.dataset.setting;if(s){S={...S,[s]:e.target.value};save();render();}});
document.addEventListener('input',e=>{const n=e.target.dataset.note;if(n!==undefined){NOTES[n]=e.target.value;save();}});
document.addEventListener('focusout',e=>{const n=e.target.dataset.note;if(n!==undefined){render();}});

load();render();

// ═══ PWA: service worker + install prompt ═══
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;showInstallBtn();});
function showInstallBtn(){
  if(document.getElementById('install-fab'))return;
  const b=document.createElement('button');
  b.id='install-fab';b.textContent='⬇ Install app';
  b.style.cssText='position:fixed;bottom:88px;right:12px;z-index:300;background:#C8321A;color:#fff;border:none;border-radius:24px;padding:11px 18px;font-size:13px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer';
  b.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;b.remove();}};
  document.body.appendChild(b);
  setTimeout(()=>{if(document.getElementById('install-fab'))b.style.opacity='0.85';},6000);
}
window.addEventListener('appinstalled',()=>{const b=document.getElementById('install-fab');if(b)b.remove();});

</script>
